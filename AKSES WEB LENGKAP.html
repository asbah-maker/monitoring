<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>✨ Dashboard Operasional | NeoGlass</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0b1120, #0a0f1c);
            min-height: 100vh;
            padding: 24px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(59,130,246,0) 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 20s infinite alternate;
        }
        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139,92,246,0.25) 0%, rgba(139,92,246,0) 70%);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatOrb 25s infinite alternate-reverse;
        }
        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            100% { transform: translate(40px, 40px) scale(1.2); opacity: 0.7; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* header glass */
        .glass-panel {
            background: rgba(15, 25, 45, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 20px 28px;
            margin-bottom: 28px;
        }

        .logo-area h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a5f3fc, #7dd3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .logo-area p {
            color: #94a3b8;
            font-size: 0.8rem;
            margin-top: 6px;
        }

        .stats {
            display: flex;
            gap: 24px;
            background: rgba(0,0,0,0.35);
            padding: 10px 24px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
        }
        .stat-item {
            text-align: center;
        }
        .stat-number {
            font-weight: 800;
            font-size: 1.5rem;
            color: white;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        /* search + filter bar */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 28px;
            align-items: center;
            justify-content: space-between;
        }
        .search-glass {
            background: rgba(255,255,255,0.08);
            border-radius: 60px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .search-glass:focus-within {
            background: rgba(255,255,255,0.15);
            border-color: #3b82f6;
            box-shadow: 0 0 12px rgba(59,130,246,0.3);
        }
        .search-glass i { color: #94a3b8; }
        .search-glass input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
            font-size: 0.9rem;
        }
        .search-glass input::placeholder { color: #64748b; }

        .filter-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            color: #e2e8f0;
            backdrop-filter: blur(5px);
        }
        .filter-btn i { margin-right: 6px; }
        .filter-btn.active {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
            box-shadow: 0 0 12px rgba(59,130,246,0.5);
        }
        .filter-btn:hover {
            background: rgba(59,130,246,0.6);
            transform: translateY(-2px);
        }

        /* kategori chips */
        .category-roll {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }
        .cat-chip {
            background: rgba(255,255,255,0.05);
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
        }
        .cat-chip.active {
            background: linear-gradient(120deg, #3b82f6, #8b5cf6);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }

        /* GRID MENU —— super menarik */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(20, 30, 55, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 24px 16px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .card:hover::before { left: 100%; }
        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(59,130,246,0.6);
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5), 0 0 0 1px rgba(59,130,246,0.3);
            background: rgba(30, 45, 75, 0.7);
        }
        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 18px;
            display: inline-block;
            transition: transform 0.2s;
        }
        .card:hover .card-icon { transform: scale(1.1) rotate(3deg); }
        .card-title {
            font-weight: 700;
            font-size: 0.95rem;
            color: #f1f5f9;
            margin-bottom: 8px;
        }
        .card-category {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .favorite-icon {
            position: absolute;
            top: 14px;
            right: 14px;
            font-size: 1.1rem;
            color: #cbd5e1;
            transition: 0.2s;
            z-index: 3;
            background: rgba(0,0,0,0.3);
            width: 28px;
            height: 28px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .favorite-icon.fav-active {
            color: #fbbf24;
            text-shadow: 0 0 6px #f59e0b;
        }
        .card a {
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .empty-message {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            background: rgba(0,0,0,0.3);
            border-radius: 2rem;
            backdrop-filter: blur(8px);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
        }
        @media (max-width: 650px) {
            .menu-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
            .header { flex-direction: column; gap: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="glass-panel header">
        <div class="logo-area">
            <h1><i class="fas fa-bolt"></i> NexDash Operasional</h1>
            <p>Smart workspace • akses cepat & favorit</p>
        </div>
        <div class="stats">
            <div class="stat-item"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total Menu</div></div>
            <div class="stat-item"><div class="stat-number" id="favCount">0</div><div class="stat-label">Favorit</div></div>
        </div>
    </div>

    <div class="action-bar">
        <div class="search-glass">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Cepat cari menu... (ex: AI, gudang, OLT)">
        </div>
        <div class="filter-group">
            <button id="favFilterBtn" class="filter-btn"><i class="far fa-star"></i> Favorit</button>
            <button id="resetFilterBtn" class="filter-btn"><i class="fas fa-sync-alt"></i> Reset</button>
        </div>
    </div>

    <div class="category-roll" id="categoryList"></div>

    <div id="menuGrid" class="menu-grid"></div>
    <div id="emptyState" class="empty-message" style="display:none">✨ Tidak ada menu yang cocok ✨</div>

    <footer>⚡ Klik bintang untuk favorit • Data tersimpan otomatis • Desain futuristik</footer>
</div>

<script>
    // ========= DATA MENU (LENGKAP DENGAN KATEGORI & ICON) ==========
    const menuData = [
        { name: "Social Chat", icon: "fab fa-whatsapp", color: "#25D366", url: "https://app.socialchat.id/app/chat", category: "Komunikasi", keywords: "chat social" },
        { name: "ACS Sinyalku", icon: "fas fa-wifi", color: "#e67e22", url: "http://192.168.31.1:3000/#!/devices", category: "Monitoring", keywords: "acs sinyalku" },
        { name: "Web Allow ZTE", icon: "fas fa-check-to-slot", color: "#00cec9", url: "https://srb.r-config.com/add-onu", category: "Tools", keywords: "zte allow" },
        { name: "Web Allow HSGQ", icon: "fas fa-link", color: "#6ab04c", url: "https://linktr.ee/sinyalku", category: "Tools", keywords: "hsgq" },
        { name: "OLT ZTE & HSGQ", icon: "fas fa-microchip", color: "#2c3e50", url: "https://webolt.sinyalku.net/", category: "Monitoring", keywords: "olt zte hsgq" },
        { name: "Member Sinyalku", icon: "fas fa-users", color: "#9b59b6", url: "https://member.sinyalku.net/dashboard", category: "Pelanggan", keywords: "member" },
        { name: "Barantum", icon: "fas fa-headset", color: "#ff4757", url: "https://my.barantum.com/barantumchat", category: "Support", keywords: "barantum chat" },
        { name: "WhatsApp Web", icon: "fab fa-whatsapp", color: "#25D366", url: "https://web.whatsapp.com/", category: "Komunikasi", keywords: "wa web" },
        { name: "Wahafe Sinyalku", icon: "fas fa-file-export", color: "#00b894", url: "https://wahafe2.sinyalku.net/export-chat", category: "Data", keywords: "wahafe export" },
        { name: "PETAK Monitor", icon: "fas fa-network-wired", color: "#c0392b", url: "http://edot92:pernahganteng2025@192.168.31.1:4021/monitoroffline?a=3", category: "Monitoring", keywords: "petak offline" },
        { name: "Monitoring Teknisi", icon: "fas fa-chart-line", color: "#2980b9", url: "https://asbah-maker.github.io/monitoring/", category: "Monitoring", keywords: "teknisi" },
        { name: "Monitoring Gudang", icon: "fas fa-warehouse", color: "#d35400", url: "https://asbah-maker.github.io/monitoring/monitoring%20barang%20gudang", category: "Inventory", keywords: "gudang stok" },
        { name: "Gudang Modem Teknisi", icon: "fas fa-cubes", color: "#e84393", url: "https://asbah-maker.github.io/monitoring/gudangmodem_teknisi", category: "Inventory", keywords: "modem teknisi" },
        { name: "Web PSB", icon: "fas fa-user-plus", color: "#16a085", url: "https://asbah-maker.github.io/monitoring/web-psb", category: "Operasional", keywords: "psb daftar" },
        { name: "To Do List", icon: "fas fa-tasks", color: "#f39c12", url: "https://asbah-maker.github.io/monitoring/to_do_list", category: "Produktivitas", keywords: "tugas" },
        { name: "Peminjaman Barang", icon: "fas fa-hand-holding", color: "#2ecc71", url: "https://asbah-maker.github.io/monitoring/peminjamanbarang", category: "Inventory", keywords: "pinjam barang" },
        { name: "GitHub Config", icon: "fab fa-github", color: "#333", url: "https://github.com/asbah-maker/monitoring/settings/pages", category: "Developer", keywords: "github" },
        { name: "Gemini AI", icon: "fas fa-brain", color: "#8b5cf6", url: "https://gemini.google.com/app?hl=id", category: "AI", keywords: "gemini" },
        { name: "DeepSeek AI", icon: "fas fa-robot", color: "#4d88ff", url: "https://chat.deepseek.com/", category: "AI", keywords: "deepseek" },
        { name: "Data Alat (Excel)", icon: "fas fa-file-excel", color: "#217346", url: "https://1drv.ms/x/c/4955526dc9bda579/IQBKkfhUj420Sa4L_o1DCABBAYDavNcinH9PxU5Sj8Zx8xA", category: "Data", keywords: "excel" },
        { name: "YouTube", icon: "fab fa-youtube", color: "#ff0000", url: "https://www.youtube.com/", category: "Hiburan", keywords: "video" }
    ];

    // Load favorit dari local storage
    let favorites = JSON.parse(localStorage.getItem('nex_favorites')) || [];
    let currentCategory = "Semua";
    let favFilterActive = false;
    let searchTerm = "";

    // Helper update stat
    function updateStats() {
        document.getElementById('totalCount').innerText = menuData.length;
        document.getElementById('favCount').innerText = favorites.length;
    }

    function saveFav() {
        localStorage.setItem('nex_favorites', JSON.stringify(favorites));
        updateStats();
        render();
    }

    function toggleFavorite(menuName, e) {
        e.stopPropagation();
        if (favorites.includes(menuName)) {
            favorites = favorites.filter(f => f !== menuName);
        } else {
            favorites.push(menuName);
        }
        saveFav();
    }

    // render berdasarkan filter
    function render() {
        let filtered = [...menuData];
        if (currentCategory !== "Semua") {
            filtered = filtered.filter(m => m.category === currentCategory);
        }
        if (favFilterActive) {
            filtered = filtered.filter(m => favorites.includes(m.name));
        }
        if (searchTerm.trim() !== "") {
            const q = searchTerm.toLowerCase();
            filtered = filtered.filter(m => m.name.toLowerCase().includes(q) || m.keywords.toLowerCase().includes(q));
        }

        const grid = document.getElementById('menuGrid');
        const emptyDiv = document.getElementById('emptyState');
        if (filtered.length === 0) {
            grid.innerHTML = '';
            emptyDiv.style.display = 'block';
            return;
        }
        emptyDiv.style.display = 'none';

        grid.innerHTML = filtered.map(item => {
            const isFav = favorites.includes(item.name);
            return `
                <div class="card" data-menu='${JSON.stringify(item)}'>
                    <div class="favorite-icon ${isFav ? 'fav-active' : ''}" data-name="${item.name}">
                        <i class="${isFav ? 'fas fa-star' : 'far fa-star'}"></i>
                    </div>
                    <a href="${item.url}" target="_blank">
                        <div class="card-icon" style="color: ${item.color}"><i class="${item.icon}"></i></div>
                        <div class="card-title">${item.name}</div>
                        <div class="card-category">${item.category}</div>
                    </a>
                </div>
            `;
        }).join('');

        // event listener untuk star
        document.querySelectorAll('.favorite-icon').forEach(star => {
            star.addEventListener('click', (e) => {
                e.preventDefault();
                const name = star.getAttribute('data-name');
                toggleFavorite(name, e);
            });
        });
    }

    // generate category chips
    function buildCategoryChips() {
        const cats = ["Semua", ...new Set(menuData.map(m => m.category))];
        const container = document.getElementById('categoryList');
        container.innerHTML = cats.map(cat => `
            <div class="cat-chip ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">${cat}</div>
        `).join('');
        document.querySelectorAll('.cat-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                currentCategory = chip.getAttribute('data-cat');
                buildCategoryChips(); // refresh active
                render();
            });
        });
    }

    // event listeners
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchTerm = e.target.value;
        render();
    });

    document.getElementById('favFilterBtn').addEventListener('click', () => {
        favFilterActive = !favFilterActive;
        const btn = document.getElementById('favFilterBtn');
        if (favFilterActive) {
            btn.classList.add('active');
            btn.innerHTML = '<i class="fas fa-star"></i> Favorit (aktif)';
        } else {
            btn.classList.remove('active');
            btn.innerHTML = '<i class="far fa-star"></i> Favorit';
        }
        render();
    });

    document.getElementById('resetFilterBtn').addEventListener('click', () => {
        searchTerm = "";
        currentCategory = "Semua";
        favFilterActive = false;
        document.getElementById('searchInput').value = "";
        document.getElementById('favFilterBtn').classList.remove('active');
        document.getElementById('favFilterBtn').innerHTML = '<i class="far fa-star"></i> Favorit';
        buildCategoryChips();
        render();
    });

    updateStats();
    buildCategoryChips();
    render();
</script>
</body>
</html>
