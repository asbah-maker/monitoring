<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ToolStock Pro | Manajemen Alat Compact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(145deg, #e9f5f1 0%, #ddebe6 100%);
            min-height: 100vh;
            padding: 20px;
            color: #1e2b2c;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(115deg, #0a3627, #145c44);
            border-radius: 32px;
            padding: 20px 32px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            color: white;
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
        }

        .app-header h1 {
            font-weight: 800;
            font-size: 1.7rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-header p {
            opacity: 0.8;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .status-badge {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px);
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.75rem;
            border: 1px solid rgba(255,255,255,0.25);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* CARDS */
        .card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 28px;
            margin-bottom: 28px;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255,255,255,0.8);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 24px;
            background: rgba(250, 252, 250, 0.7);
            border-bottom: 1px solid #e2efe9;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .card-header h2 {
            font-weight: 700;
            font-size: 1.2rem;
            color: #126e4b;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body {
            padding: 20px 24px;
        }

        /* INVENTORY GRID COMPACT + SCROLL */
        .inventory-grid-scroll {
            max-height: 460px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .compact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 14px;
        }

        /* kotak alat / item-card */
        .item-card {
            background: white;
            border-radius: 20px;
            padding: 14px 12px 12px 12px;
            transition: all 0.2s ease;
            border: 1px solid #e4efe9;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-card:hover {
            transform: translateY(-2px);
            border-color: #bdd9cf;
            box-shadow: 0 10px 18px -8px rgba(0, 0, 0, 0.1);
        }

        .item-name {
            font-weight: 700;
            font-size: 0.85rem;
            background: #ecf9f2;
            padding: 6px 10px;
            border-radius: 40px;
            display: inline-block;
            text-align: center;
            color: #106a4a;
            word-break: break-word;
            line-height: 1.3;
        }

        .item-stock-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8faf8;
            padding: 4px 8px;
            border-radius: 48px;
            margin-top: 4px;
        }

        .stock-control-compact {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            border-radius: 40px;
            padding: 2px 8px;
            border: 1px solid #dee8e3;
        }

        .stock-value {
            font-weight: 800;
            font-size: 1.1rem;
            min-width: 32px;
            text-align: center;
            color: #1e462e;
        }

        .stock-btn {
            width: 28px;
            height: 28px;
            border-radius: 30px;
            background: white;
            border: 1px solid #cbdcd3;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .stock-btn:hover {
            background: #1d6f4c;
            color: white;
            border-color: #1d6f4c;
        }

        .status-tag-mini {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 28px;
            text-align: center;
        }

        .status-available {
            background: #dcfce7;
            color: #15803d;
        }

        .status-empty {
            background: #ffe4e2;
            color: #b91c1c;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
        }

        .card-actions button {
            background: transparent;
            border: none;
            font-size: 0.75rem;
            padding: 5px 0;
            border-radius: 28px;
            cursor: pointer;
            width: 50%;
            font-weight: 500;
            transition: 0.1s;
        }

        .btn-edit-card {
            background: #eef3f0;
            color: #2c6b4c;
        }
        .btn-edit-card:hover {
            background: #ddece4;
        }
        .btn-delete-card {
            background: #fef1f0;
            color: #c2412c;
        }
        .btn-delete-card:hover {
            background: #fde2df;
        }

        /* FORM & BUTTONS GLOBAL */
        .btn {
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-primary {
            background: linear-gradient(100deg, #1f6e48, #0f543b);
            color: white;
            box-shadow: 0 2px 6px rgba(26, 86, 59, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            background: #115e3e;
        }
        .btn-outline {
            background: white;
            border: 1px solid #cadcd3;
            color: #2d4a3e;
        }
        .btn-outline:hover {
            background: #edf5f1;
        }
        .btn-warning {
            background: #fbbf24;
            color: #2c2b1f;
        }
        .btn-danger {
            background: #fee2e2;
            color: #b91c1c;
        }
        .search-input {
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #cfe3db;
            background: white;
            font-size: 0.8rem;
            width: 200px;
        }
        .search-input:focus {
            outline: none;
            border-color: #2c8b60;
            box-shadow: 0 0 0 2px rgba(44,139,96,0.15);
        }

        /* TABLES */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        th {
            text-align: left;
            padding: 10px 12px;
            background: #f4fbf7;
            font-weight: 700;
            color: #1c5a44;
            border-bottom: 1px solid #d4e6df;
        }
        td {
            padding: 12px 12px;
            border-bottom: 1px solid #ecf3ef;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: #88a89b;
            font-weight: 500;
        }

        /* SCROLLBAR */
        .inventory-grid-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .inventory-grid-scroll::-webkit-scrollbar-track {
            background: #e0ebe5;
            border-radius: 10px;
        }
        .inventory-grid-scroll::-webkit-scrollbar-thumb {
            background: #8bb7a4;
            border-radius: 10px;
        }
        @media (max-width: 640px) {
            body { padding: 14px; }
            .compact-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-body { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <header class="app-header">
        <div>
            <h1><i class="fas fa-toolbox"></i> ToolStock Pro</h1>
            <p>Manajemen alat & peminjaman teknisi · tampilan compact</p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div class="status-badge"><i class="fas fa-circle" id="connIcon"></i> <span id="connText">Online</span></div>
            <div class="status-badge"><i class="fas fa-cubes"></i> <span id="totalItemsCount">0</span> item</div>
        </div>
    </header>

    <!-- INVENTORY CARD : COMPACT GRID + SCROLLABLE -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-archive"></i> Inventaris Alat</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <input type="text" id="searchItemInput" class="search-input" placeholder="Cari nama alat...">
                <button id="hideInventoryBtn" class="btn btn-outline"><i class="fas fa-eye-slash"></i> Sembunyi</button>
                <button id="unhideInventoryBtn" class="btn btn-primary"><i class="fas fa-lock-open"></i> Buka</button>
                <button id="addItemBtn" class="btn btn-primary" style="background:#475569;"><i class="fas fa-plus"></i> Tambah</button>
            </div>
        </div>
        <div class="card-body">
            <div id="inventoryScrollArea" class="inventory-grid-scroll">
                <div id="inventoryCompactGrid" class="compact-grid"></div>
            </div>
        </div>
    </div>

    <!-- PEMINJAMAN BARU -->
    <div class="card">
        <div class="card-header"><h2><i class="fas fa-hand-holding"></i> Peminjaman Baru</h2></div>
        <div class="card-body">
            <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-end;">
                <div style="flex:2; min-width: 170px;">
                    <label style="font-weight:600; font-size:0.7rem;">PILIH ALAT</label>
                    <select id="borrowItemSelect" class="search-input" style="width:100%; margin-top:6px;"></select>
                </div>
                <div style="flex:1.5; min-width: 140px;">
                    <label style="font-weight:600; font-size:0.7rem;">TEKNISI</label>
                    <select id="borrowTechnicianSelect" class="search-input" style="width:100%;"></select>
                </div>
                <div style="flex:1; min-width: 100px;">
                    <label style="font-weight:600; font-size:0.7rem;">JUMLAH</label>
                    <input type="number" id="borrowQty" value="1" min="1" class="search-input" style="width:100%;">
                </div>
                <button id="borrowBtn" class="btn btn-primary"><i class="fas fa-check-circle"></i> Pinjam</button>
            </div>
        </div>
    </div>

    <!-- PEMINJAMAN AKTIF -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-sync-alt"></i> Peminjaman Aktif</h2>
            <input type="text" id="searchActiveLoan" class="search-input" placeholder="Cari alat/teknisi...">
        </div>
        <div class="card-body" style="overflow-x: auto;">
            <table style="min-width: 500px;">
                <thead><tr><th>No</th><th>Alat</th><th>Teknisi</th><th>Jml</th><th>Tanggal Pinjam</th><th>Aksi</th></tr></thead>
                <tbody id="activeLoansBody"></tbody>
            </table>
        </div>
    </div>

    <!-- RIWAYAT -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-history"></i> Riwayat Pengembalian</h2>
            <div style="display:flex; gap:10px;">
                <input type="text" id="searchHistoryInput" class="search-input" placeholder="Cari...">
                <button id="clearHistoryBtn" class="btn btn-danger"><i class="fas fa-trash-alt"></i> Bersihkan</button>
            </div>
        </div>
        <div class="card-body" style="overflow-x: auto;">
            <table style="min-width: 600px;">
                <thead><tr><th>No</th><th>Alat</th><th>Teknisi</th><th>Jml</th><th>Pinjam</th><th>Kembali</th><th>Hapus</th></tr></thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
    (function() {
        // Firebase config (sama seperti sebelumnya)
        const firebaseConfig = {
            apiKey: "AIzaSyAtcThyvxbqHAq9mdBZQpNvgEzls2dAPLY",
            authDomain: "clonemonitoringteknisi.firebaseapp.com",
            databaseURL: "https://clonemonitoringteknisi-default-rtdb.firebaseio.com",
            projectId: "clonemonitoringteknisi",
            storageBucket: "clonemonitoringteknisi.firebasestorage.app",
            messagingSenderId: "248130180868",
            appId: "1:248130180868:web:1859dab6e4c8c0c8cb6251"
        };
        const PASSWORD = "bengkel2024";
        const TECHNICIANS = ["Ajis","Bima","Bimo","Dani","Deni","Tomy","Takim","Reza","Pian","Rahmat","Kholis","Yudha","Rival","Ifsal","Reno","Tangguh","Riki"];

        let items = [];
        let loans = [];
        let isOnline = false;
        let db, itemsRef, loansRef;
        let inventoryHidden = false;

        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        itemsRef = db.ref('items');
        loansRef = db.ref('loans');

        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            isOnline = snap.val() === true;
            const icon = document.getElementById('connIcon');
            const text = document.getElementById('connText');
            if (isOnline) {
                icon.style.color = '#2ecc71';
                text.textContent = 'Online · realtime';
                startDataSync();
            } else {
                icon.style.color = '#f39c12';
                text.textContent = 'Offline (menunggu)';
            }
        });

        function startDataSync() {
            itemsRef.on('value', (snap) => {
                const data = snap.val() || {};
                items = Object.entries(data).map(([id, val]) => ({
                    id, name: val.name || '?', stock: val.stock || 0
                }));
                renderCompactInventory();
                updateBorrowSelect();
                document.getElementById('totalItemsCount').innerText = items.length;
            });

            loansRef.on('value', (snap) => {
                const data = snap.val() || {};
                loans = Object.entries(data).map(([id, val]) => ({
                    id, itemId: val.itemId, itemName: val.itemName || '', technician: val.technician || '',
                    quantity: val.quantity || 1, borrowDate: val.borrowDate || new Date().toISOString(),
                    returned: val.returned || false, returnDate: val.returnDate || null
                }));
                renderActiveLoans();
                renderHistory();
            });
        }

        // ADJUST (stok +/-)
        function adjustStock(itemId, delta) {
            itemsRef.child(itemId).transaction(current => {
                if (current) {
                    const newStock = (current.stock || 0) + delta;
                    if (newStock < 0) return undefined;
                    return { ...current, stock: newStock };
                }
                return undefined;
            }, (err, committed) => {
                if (err) alert("Error update stok");
                if (!committed) alert("Stok tidak mencukupi!");
            });
        }

        function addItem(name, stock) {
            if (!name.trim()) return;
            itemsRef.push({ name: name.trim(), stock: Math.max(0, parseInt(stock) || 0) });
        }

        function editItem(id, newName, newStock) {
            itemsRef.child(id).update({ name: newName, stock: Math.max(0, parseInt(newStock) || 0) });
        }

        function deleteItem(id) {
            const isBorrowed = loans.some(l => l.itemId === id && !l.returned);
            if (isBorrowed) { alert("Barang sedang dipinjam, tidak bisa dihapus!"); return; }
            itemsRef.child(id).remove();
        }

        function borrowItem(itemId, technician, quantity) {
            const item = items.find(i => i.id === itemId);
            if (!item || item.stock < quantity || !TECHNICIANS.includes(technician)) {
                alert("Stok tidak cukup atau teknisi tidak valid!");
                return;
            }
            itemsRef.child(itemId).transaction(current => {
                if (current && current.stock >= quantity) {
                    return { ...current, stock: current.stock - quantity };
                }
                return undefined;
            }, (err, committed) => {
                if (!committed) { alert("Gagal meminjam, periksa stok."); return; }
                loansRef.push({
                    itemId, itemName: item.name, technician, quantity,
                    borrowDate: new Date().toISOString(), returned: false, returnDate: null
                });
            });
        }

        function returnLoan(loanId) {
            const loan = loans.find(l => l.id === loanId);
            if (!loan || loan.returned) return;
            itemsRef.child(loan.itemId).transaction(current => {
                if (current) return { ...current, stock: (current.stock || 0) + loan.quantity };
            });
            loansRef.child(loanId).update({ returned: true, returnDate: new Date().toISOString() });
        }

        function deleteHistoryEntry(loanId) {
            const loan = loans.find(l => l.id === loanId);
            if (loan && loan.returned) loansRef.child(loanId).remove();
        }

        function clearHistory() {
            const returnedIds = loans.filter(l => l.returned).map(l => l.id);
            if (returnedIds.length && confirm("Hapus semua riwayat pengembalian?")) {
                const updates = {};
                returnedIds.forEach(id => updates[id] = null);
                loansRef.update(updates);
            }
        }

        // RENDER INVENTORY -- COMPACT GRID + SCROLLABLE
        function renderCompactInventory() {
            const gridContainer = document.getElementById('inventoryCompactGrid');
            if (!gridContainer) return;

            if (inventoryHidden) {
                gridContainer.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-lock fa-2x"></i><p>Inventaris disembunyikan (klik Buka dengan password)</p></div>`;
                return;
            }

            const searchTerm = document.getElementById('searchItemInput')?.value.toLowerCase() || '';
            const filtered = items.filter(i => i.name.toLowerCase().includes(searchTerm));

            if (filtered.length === 0) {
                gridContainer.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">🔍 Tidak ada alat ditemukan</div>`;
                return;
            }

            // Membangun kartu-kartu kecil (compact boxes)
            gridContainer.innerHTML = filtered.map(item => `
                <div class="item-card" data-item-id="${item.id}">
                    <div class="item-name">${escapeHtml(item.name)}</div>
                    <div class="item-stock-area">
                        <div class="stock-control-compact">
                            <button class="stock-btn minus-btn" data-id="${item.id}" data-d="-1">−</button>
                            <span class="stock-value">${item.stock}</span>
                            <button class="stock-btn plus-btn" data-id="${item.id}" data-d="1">+</button>
                        </div>
                        <span class="status-tag-mini ${item.stock > 0 ? 'status-available' : 'status-empty'}">${item.stock > 0 ? 'Tersedia' : 'Kosong'}</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn-edit-card" data-edit="${item.id}"><i class="fas fa-pen"></i> Edit</button>
                        <button class="btn-delete-card" data-delete="${item.id}"><i class="fas fa-trash"></i> Hapus</button>
                    </div>
                </div>
            `).join('');
        }

        function updateBorrowSelect() {
            const select = document.getElementById('borrowItemSelect');
            if (!select) return;
            select.innerHTML = '<option value="">-- Pilih alat tersedia --</option>';
            const availableItems = items.filter(i => i.stock > 0);
            availableItems.forEach(i => {
                select.innerHTML += `<option value="${i.id}">${escapeHtml(i.name)} (stok: ${i.stock})</option>`;
            });
        }

        function renderActiveLoans() {
            const search = document.getElementById('searchActiveLoan')?.value.toLowerCase() || '';
            const filtered = loans.filter(l => !l.returned && (l.itemName.toLowerCase().includes(search) || l.technician.toLowerCase().includes(search)));
            const tbody = document.getElementById('activeLoansBody');
            if (!tbody) return;
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">✨ Tidak ada peminjaman aktif</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map((l, idx) => `
                <tr>
                    <td>${idx+1}</td><td><strong>${escapeHtml(l.itemName)}</strong></td><td>${escapeHtml(l.technician)}</td>
                    <td>${l.quantity}</td><td>${formatDate(l.borrowDate)}</td>
                    <td><button class="btn btn-warning return-loan-btn" data-return="${l.id}" style="padding:6px 12px;"><i class="fas fa-undo-alt"></i> Kembali</button></td>
                </tr>
            `).join('');
        }

        function renderHistory() {
            const search = document.getElementById('searchHistoryInput')?.value.toLowerCase() || '';
            const filtered = loans.filter(l => l.returned && (l.itemName.toLowerCase().includes(search) || l.technician.toLowerCase().includes(search)));
            const tbody = document.getElementById('historyBody');
            if (!tbody) return;
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">📭 Belum ada riwayat pengembalian</td></tr>';
                return;
            }
            tbody.innerHTML = filtered.map((l, idx) => `
                <tr>
                    <td>${idx+1}</td><td>${escapeHtml(l.itemName)}</td><td>${escapeHtml(l.technician)}</td><td>${l.quantity}</td>
                    <td>${formatDate(l.borrowDate)}</td><td>${l.returnDate ? formatDate(l.returnDate) : '-'}</td>
                    <td><button class="btn btn-outline del-hist-btn" data-delhist="${l.id}" style="color:#b91c1c;"><i class="fas fa-times-circle"></i> Hapus</button></td>
                </tr>
            `).join('');
        }

        function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;});}
        function formatDate(iso) { if(!iso) return '-'; return new Date(iso).toLocaleString('id-ID', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }); }

        // EVENT DELEGATION (semua tombol)
        document.body.addEventListener('click', (e) => {
            const target = e.target.closest('button');
            if (!target) return;

            // stock +/- dari compact grid
            if (target.classList.contains('stock-btn') || (target.dataset.d && target.dataset.id)) {
                const itemId = target.dataset.id;
                const delta = parseInt(target.dataset.d);
                if (itemId && !isNaN(delta)) adjustStock(itemId, delta);
            }
            // edit item (compact)
            else if (target.dataset.edit) {
                const item = items.find(i => i.id === target.dataset.edit);
                if (item) {
                    const newName = prompt("Nama alat baru:", item.name);
                    if (newName && newName.trim()) {
                        const newStock = prompt("Stok baru:", item.stock);
                        editItem(item.id, newName.trim(), parseInt(newStock) || 0);
                    }
                }
            }
            // delete item
            else if (target.dataset.delete) {
                if (confirm("Yakin hapus alat ini?")) deleteItem(target.dataset.delete);
            }
            // return loan
            else if (target.dataset.return) {
                if (confirm("Kembalikan alat?")) returnLoan(target.dataset.return);
            }
            // hapus riwayat
            else if (target.dataset.delhist) {
                if (confirm("Hapus catatan riwayat ini?")) deleteHistoryEntry(target.dataset.delhist);
            }
        });

        // BUTTON REF
        document.getElementById('hideInventoryBtn')?.addEventListener('click', () => { inventoryHidden = true; renderCompactInventory(); });
        document.getElementById('unhideInventoryBtn')?.addEventListener('click', () => {
            const pw = prompt("Masukkan password admin:");
            if (pw === PASSWORD) { inventoryHidden = false; renderCompactInventory(); }
            else alert("Password salah!");
        });
        document.getElementById('addItemBtn')?.addEventListener('click', () => {
            if (inventoryHidden) { alert("Unhide inventory terlebih dahulu."); return; }
            const nama = prompt("Nama alat baru:");
            if (nama) addItem(nama, parseInt(prompt("Stok awal:")) || 0);
        });
        document.getElementById('borrowBtn')?.addEventListener('click', () => {
            const itemId = document.getElementById('borrowItemSelect').value;
            const tech = document.getElementById('borrowTechnicianSelect').value;
            const qty = parseInt(document.getElementById('borrowQty').value);
            if (itemId && tech && qty > 0) borrowItem(itemId, tech, qty);
            else alert("Pilih alat dan teknisi dengan benar");
        });
        document.getElementById('searchItemInput')?.addEventListener('input', () => renderCompactInventory());
        document.getElementById('searchActiveLoan')?.addEventListener('input', () => renderActiveLoans());
        document.getElementById('searchHistoryInput')?.addEventListener('input', () => renderHistory());
        document.getElementById('clearHistoryBtn')?.addEventListener('click', clearHistory);

        // Load teknisi dropdown
        const techSelect = document.getElementById('borrowTechnicianSelect');
        if (techSelect) techSelect.innerHTML = TECHNICIANS.map(t => `<option value="${t}">${t}</option>`).join('');

        // Default state
        renderCompactInventory();
    })();
</script>
</body>
</html>
